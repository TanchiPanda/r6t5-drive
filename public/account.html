<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的容量 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/branding/favicon">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="account">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" data-brand-logo src="/assets/favicon.svg" width="18" height="18" alt=""><div><span data-brand-name>R6T5 Drive</span><small>个人空间</small></div></div>
    <nav class="nav">
      <a href="/files"><span class="ic"><svg aria-hidden="true"><use href="/assets/icons/sprite.svg#i-home"></use></svg></span>文件</a>
      <a href="/account" class="active"><span class="ic"><svg aria-hidden="true"><use href="/assets/icons/sprite.svg#i-chart"></use></svg></span>我的容量</a>
      <a href="/store"><span class="ic"><svg aria-hidden="true"><use href="/assets/icons/sprite.svg#i-bag"></use></svg></span>商店</a>
      <a href="#" class="disabled" title="分享将在 P2 开放"><span class="ic"><svg aria-hidden="true"><use href="/assets/icons/sprite.svg#i-share"></use></svg></span>分享</a>
    </nav>
    <div data-brand-sidehtml></div>
    <div class="side-foot">
      <div id="acct-email" class="faint">未登录</div>
      <a href="#" id="logout-link" class="faint">退出登录</a>
    </div>
  </aside>

  <div class="main-col">
    <div class="topbar">
      <div class="page-title small muted">我的容量</div>
      <div class="spacer"></div>
      <button class="btn icon ghost" id="theme-btn" type="button">☾</button>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>

    <main class="main">
      <div class="content">
        <div class="page-head">
          <div>
            <h1>我的容量</h1>
            <p class="sub" id="acct-group">查看空间、单文件上限与近 7 天上传流量</p>
          </div>
        </div>

        <div class="acct-stats">
          <div class="stat">
            <div class="k">已用空间</div>
            <div class="v" id="stat-used">—</div>
            <div class="bar mt2" id="stat-used-bar"><i style="width:0%"></i></div>
            <div class="d mt2" id="stat-used-sub"></div>
          </div>
          <div class="stat">
            <div class="k">单文件上限</div>
            <div class="v" id="stat-maxfile">—</div>
            <div class="d mt2">单个文件允许的最大体积</div>
          </div>
          <div class="stat">
            <div class="k">7 天上传流量</div>
            <div class="v"><span id="stat-traffic-used">—</span><small> / <span id="stat-traffic-limit">—</span></small></div>
            <div class="bar mt2" id="stat-traffic-bar"><i style="width:0%"></i></div>
            <div class="d mt2">剩余 <span id="stat-traffic-remain">—</span></div>
          </div>
        </div>

        <div class="grid g2">
          <div class="card">
            <div class="card-head"><h3>按类型占用</h3><span class="hint">图片 / 文档 / 其他</span></div>
            <div id="bytype-list"></div>
          </div>
          <div class="card">
            <div class="card-head"><h3>最近上传</h3></div>
            <div id="recent-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
