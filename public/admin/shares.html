<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分享 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="shares">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>R6T5 Drive<small>管理控制台</small></div></div>
    <nav class="nav">
      <div class="nav-group">运行</div>
      <a href="/admin/home.html"><span class="ic">▤</span>概览</a>
      <a href="/admin/users.html"><span class="ic">◉</span>用户</a>
      <a href="/admin/storage.html"><span class="ic">▣</span>文件系统</a>
      <a href="/admin/groups.html"><span class="ic">◫</span>用户组</a>
      <div class="nav-group">治理</div>
      <a href="/admin/shares.html" class="active"><span class="ic">⇪</span>分享</a>
      <a href="/admin/trash.html"><span class="ic">▥</span>回收站</a>
      <a href="/admin/audit.html"><span class="ic">☰</span>审计</a>
      <div class="nav-group">系统</div>
      <a href="/admin/settings.html"><span class="ic">⚙</span>站点设置</a>
    </nav>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">分享</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>分享</h1><p class="sub">对外分享链接管理</p></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>
          <div class="card flat toolbar">
            <div class="row tight">
              <select class="select" id="share-status" style="max-width:180px">
                <option value="">全部状态</option>
                <option value="active">有效</option>
                <option value="expired">已过期</option>
                <option value="revoked">已撤销</option>
                <option value="exhausted">次数用尽</option>
              </select>
              <div class="searchbox">
                <input class="input" id="share-email" type="search" placeholder="按分享者邮箱搜索…" autocomplete="off">
              </div>
              <button class="btn sm" id="share-search" type="button">查询</button>
              <div class="spacer"></div>
              <span class="faint small" id="share-count"></span>
            </div>
          </div>
          <div id="share-state"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
