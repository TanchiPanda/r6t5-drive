      <a href="/admin/groups.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 1 2-2h13"/><path d="M8 7h7M8 11h7"/></svg></span>用户组</a>

      <a href="/admin/trash.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></svg></span>回收站</a>
      <a href="/admin/audit.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-7"/></svg></span>审计</a>

    </nav>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">站点设置</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>站点设置</h1><p class="sub">站点信息、注册策略与默认偏好</p></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>
          <div class="card" style="max-width:720px">
            <form id="settings-form" novalidate>
              <div class="form-grid">
                <div class="field">
                  <label for="f-siteName">站点名</label>
                  <input class="input" id="f-siteName" name="siteName" type="text" placeholder="R6T5 Drive">
                </div>
                <div class="field">
                  <label for="f-publicUrl">对外地址</label>
                  <input class="input" id="f-publicUrl" name="publicUrl" type="text" placeholder="https://drive.example.com">
                </div>
                <div class="field">
                  <label for="f-defaultGroupId">默认用户组</label>
                  <select class="select" id="f-defaultGroupId" name="defaultGroupId"></select>
                </div>
                <div class="field">
                  <label for="f-themeDefault">默认主题</label>
                  <select class="select" id="f-themeDefault" name="themeDefault">
                    <option value="dark">深色</option>
                    <option value="light">浅色</option>
                  </select>
                </div>
                <div class="field">
                  <label for="f-trashRetentionDays">回收站保留天数</label>
                  <input class="input" id="f-trashRetentionDays" name="trashRetentionDays" type="number" min="1" step="1">
                </div>
                <div class="field">
                  <label>注册策略</label>
                  <label class="check"><input type="checkbox" id="f-allowSignup" name="allowSignup"><span>允许访客自助注册</span></label>
                </div>
              </div>
              <div class="row mt4">
                <button class="btn primary" type="submit">保存设置</button>
              </div>
            </form>
          </div>

          <div class="card update-card" style="max-width:720px">
            <div class="page-head">
              <div><h2>关于 / 更新</h2><p class="sub">版本信息与远端发布检查</p></div>
              <div class="actions"><button class="btn sm" id="update-check-btn" type="button">检查更新</button></div>
            </div>
            <div class="update-meta">
              <div class="kv-line"><span class="k">当前版本</span><span class="v" id="update-current-version">—</span></div>
              <div class="kv-line"><span class="k">构建时间</span><span class="v" id="update-current-built">—</span></div>
            </div>
            <div id="update-status" class="update-status"></div>
            <div id="update-latest" class="hide">
              <div class="kv-line"><span class="k">最新版本</span><span class="v" id="update-latest-version">—</span></div>
              <div class="kv-line"><span class="k">发布时间</span><span class="v" id="update-latest-published">—</span></div>
              <div class="update-notes" id="update-latest-notes"></div>
              <a class="btn sm" id="update-latest-link" target="_blank" rel="noopener">查看发布说明</a>
              <div class="update-cmd-row">
                <code class="update-cmd" id="update-latest-command"></code>
                <button class="btn sm ghost" id="update-copy-cmd" type="button">复制</button>
              </div>
              <p class="help mt2">升级后刷新本页</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
