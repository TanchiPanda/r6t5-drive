<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件索引 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/branding/favicon">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="blobs">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" data-brand-logo src="/assets/icons/favicon.svg" width="18" height="18" alt=""><div><span data-brand-name>R6T5 Drive</span><small>管理控制台</small></div></div>
    <nav class="nav" id="nav-admin"></nav>
    <div data-brand-sidehtml></div>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">文件索引</div>
      <div class="spacer"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>文件索引</h1><p class="sub">扁平 Blob：存储策略 / 索引号 / 归属邮箱 / 用户路径 / 实际文件名</p></div>
          <div class="actions"><button class="btn" id="btn-refresh" type="button">刷新</button></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>
          <div class="card">
            <div class="card-head"><h3>Blob 列表</h3><input class="input sm" id="q" placeholder="搜索邮箱 / 路径 / 文件名" style="max-width:260px"></div>
            <div class="table-wrap"><table class="table" id="tbl">
              <thead><tr><th>索引号</th><th>存储策略</th><th>归属邮箱</th><th>用户路径</th><th>实际文件名</th><th>大小</th><th>引用</th><th>状态</th><th>操作</th></tr></thead>
              <tbody></tbody>
            </table></div>
            <div class="card-foot faint" id="meta"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="/assets/sidebar.js"></script>
<script type="module">
const $ = (s) => document.querySelector(s);
const api = async (url, opt = {}) => {
  const r = await fetch(url, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opt });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || j.error || ('HTTP ' + r.status));
  return j;
};
const fmt = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : n < 1073741824 ? (n/1048576).toFixed(1) + ' MB' : (n/1073741824).toFixed(2) + ' GB';
function alertMsg(t) { const a = $('#page-alert'); a.textContent = t; a.classList.toggle('hide', !t); }
async function load() {
  const q = encodeURIComponent($('#q').value.trim());
  const d = await api('/api/admin/blobs?limit=200&q=' + q);
  const tb = $('#tbl tbody'); tb.innerHTML = '';
  for (const it of d.items) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><code>' + it.index + '</code></td><td>' + (it.strategyName || it.strategyType || '') + '</td><td>' + (it.ownerEmail || '—') + '</td><td class="mono">' + (it.userPath || '—') + '</td><td>' + it.filename + '</td><td>' + fmt(it.sizeBytes) + '</td><td>' + it.refCount + '</td><td>' + it.state + '</td>';
    const td = document.createElement('td');
    const dl = document.createElement('a'); dl.className = 'btn xs ghost'; dl.href = '/api/admin/blobs/' + it.id + '/download'; dl.textContent = '下载';
    const tr2 = document.createElement('button'); tr2.className = 'btn xs'; tr2.textContent = '转移'; tr2.onclick = () => transfer(it);
    const del = document.createElement('button'); del.className = 'btn xs ghost'; del.textContent = '软删'; del.onclick = () => remove(it);
    td.append(dl, tr2, del); tr.append(td); tb.append(tr);
  }
  $('#meta').textContent = '共 ' + d.items.length + ' 条（最多 200）';
}
async function transfer(it) {
  const email = prompt('转移到邮箱', it.ownerEmail || '');
  if (!email) return;
  const path = prompt('目标目录（留空=该用户根目录）', email);
  if (path === null) return;
  try { await api('/api/admin/blobs/' + it.id + '/transfer', { method: 'POST', body: JSON.stringify({ email, path: path || email }) }); alertMsg('已转移所有权（仅元数据）'); load(); }
  catch (e) { alertMsg(e.message); }
}
async function remove(it) {
  if (!confirm('软删该文件节点？用户可在回收站恢复。')) return;
  try { await api('/api/admin/blobs/' + it.id, { method: 'DELETE' }); load(); } catch (e) { alertMsg(e.message); }
}
$('#btn-refresh').onclick = () => load().catch(e => alertMsg(e.message));
$('#q').onkeydown = (e) => { if (e.key === 'Enter') load().catch(e2 => alertMsg(e2.message)); };
$('#logout-btn').onclick = async () => { await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }); location.href = '/admin/login.html'; };
load().catch(e => alertMsg(e.message));
</script>
</body>
</html>
