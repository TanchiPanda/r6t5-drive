<script type="module">
const $ = (s) => document.querySelector(s);
const api = async (url, opt = {}) => {
  const r = await fetch(url, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...opt });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || j.error || ('HTTP ' + r.status));
  return j;
};
const fmt = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : n < 1073741824 ? (n/1048576).toFixed(1) + ' MB' : (n/1073741824).toFixed(2) + ' GB';
function alertMsg(t) { const a = $('#page-alert'); a.textContent = t; a.classList.toggle('hide', !t); }
async function load() {
  const q = encodeURIComponent($('#q').value.trim());
  const d = await api('/api/admin/blobs?limit=200&q=' + q);
  const tb = $('#tbl tbody'); tb.innerHTML = '';
  for (const it of d.items) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><code>' + it.index + '</code></td><td>' + (it.strategyName || it.strategyType || '') + '</td><td>' + (it.ownerEmail || '—') + '</td><td class="mono">' + (it.userPath || '—') + '</td><td>' + it.filename + '</td><td>' + fmt(it.sizeBytes) + '</td><td>' + it.refCount + '</td><td>' + it.state + '</td>';
    const td = document.createElement('td');
    const dl = document.createElement('a'); dl.className = 'btn xs ghost'; dl.href = '/api/admin/blobs/' + it.id + '/download'; dl.textContent = '下载';
    const tr2 = document.createElement('button'); tr2.className = 'btn xs'; tr2.textContent = '转移'; tr2.onclick = () => transfer(it);
    const del = document.createElement('button'); del.className = 'btn xs ghost'; del.textContent = '软删'; del.onclick = () => remove(it);
    td.append(dl, tr2, del); tr.append(td); tb.append(tr);
  }
  $('#meta').textContent = '共 ' + d.items.length + ' 条（最多 200）';
}
async function transfer(it) {
  const email = prompt('转移到邮箱', it.ownerEmail || '');
  if (!email) return;
  const path = prompt('目标目录（留空=该用户根目录）', email);
  if (path === null) return;
  try { await api('/api/admin/blobs/' + it.id + '/transfer', { method: 'POST', body: JSON.stringify({ email, path: path || email }) }); alertMsg('已转移所有权（仅元数据）'); load(); }
  catch (e) { alertMsg(e.message); }
}
async function remove(it) {
  if (!confirm('软删该文件节点？用户可在回收站恢复。')) return;
  try { await api('/api/admin/blobs/' + it.id, { method: 'DELETE' }); load(); } catch (e) { alertMsg(e.message); }
}
$('#btn-refresh').onclick = () => load().catch(e => alertMsg(e.message));
$('#q').onkeydown = (e) => { if (e.key === 'Enter') load().catch(e2 => alertMsg(e2.message)); };
$('#logout-btn').onclick = async () => { await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }); location.href = '/admin/login.html'; };
load().catch(e => alertMsg(e.message));
</script>
