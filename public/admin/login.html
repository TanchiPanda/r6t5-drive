<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理员登录 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/branding/favicon">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="login">
  <div class="login-topbar">
    <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
  </div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><img class="brand-mark" data-brand-logo src="/assets/icons/favicon.svg" width="18" height="18" alt=""><div><span data-brand-name>R6T5 Drive</span><small>管理控制台</small></div></div>
      <p class="sub">请输入管理密码进入后台。管理密码由服务端首次启动时生成并打印在容器日志中。</p>
      <div class="note info hide" id="existing-session-note" role="status">
        <span class="ico">i</span>
        <div class="note-body">当前已有前台账号会话；如需进入管理后台，请使用 sudo 用户组账号或管理员密码登录。</div>
      </div>
      <div class="card">
        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-password">管理密码</label>
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入管理密码" autofocus>
            <span class="login-err" id="login-err"></span>
          </div>
          <button class="btn primary block lg" type="submit">登录后台</button>
        </form>
      </div>
      <div class="login-divider"><span>或</span></div>
      <div class="card">
        <p class="sub sudo-sub">sudo 用户组账号可直接进入</p>
        <form id="sudo-form" novalidate>
          <div class="field">
            <label for="sudo-email">邮箱</label>
            <input class="input" id="sudo-email" name="email" type="email" autocomplete="username" placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="sudo-password">密码</label>
            <input class="input" id="sudo-password" name="password" type="password" autocomplete="current-password" placeholder="请输入账号密码">
            <span class="login-err" id="sudo-err"></span>
          </div>
          <button class="btn primary block lg" type="submit">进入后台</button>
        </form>
      </div>
      <p class="faint small mt4 center">普通用户请前往前台登录，此处仅对管理员开放。</p>
    </div>
  </div>
  <div class="toasts"></div>
  <script src="/assets/api.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
