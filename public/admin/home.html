<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概览 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/branding/favicon">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="home">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" data-brand-logo src="/assets/icons/favicon.svg" width="18" height="18" alt=""><div><span data-brand-name>R6T5 Drive</span><small>管理控制台</small></div></div>
    <nav class="nav">
      <div class="nav-group">运行</div>
      <a href="/admin/home.html" class="active"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>概览</a>
      <a href="/admin/users.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg></span>用户</a>
      <a href="/admin/storage.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h6l2 3h10v11H3z"/></svg></span>文件系统</a>
      <a href="/admin/groups.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 1 2-2h13"/><path d="M8 7h7M8 11h7"/></svg></span>用户组</a>
      <div class="nav-group">治理</div>
      <a href="/admin/shares.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1" fill="white"/></svg></span>分享</a>
      <a href="/admin/trash.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></svg></span>回收站</a>
      <a href="/admin/audit.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-7"/></svg></span>审计</a>
      <div class="nav-group">系统</div>
      <a href="/admin/settings.html"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.3.4.8.7 1.5.7H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>站点设置</a>
    </nav>
    <div data-brand-sidehtml></div>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">概览</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>概览</h1><p class="sub">站点运行状态</p></div>
          <div class="actions"><button class="btn" id="btn-refresh" type="button">刷新</button></div>
        </div>
        <div class="stack">
          <div class="card flat usource-bar" id="user-source-bar">
            <div class="usource-row">
              <label class="switch">
                <input type="checkbox" id="usource-switch">
                <span></span>
              </label>
              <span class="usource-label">使用 R6T5 Drive 数据卷管理用户</span>
              <button class="usource-info" type="button" id="usource-info-btn" aria-label="账号来源说明" title="将账户数据直接放在数据卷中，请注意数据安全">i<span class="usource-tip" id="usource-tip" role="tooltip">将账户数据直接放在数据卷中，请注意数据安全</span></button>
            </div>
            <div class="usource-meta">
              <span id="usource-state">当前：—</span>
              <span id="usource-switched-at" class="faint"></span>
            </div>
          </div>
          <div id="setup-note"></div>
          <div id="page-alert" class="page-alert hide"></div>
          <div class="grid g4" id="stats"></div>
          <div class="grid g2">
            <div class="card">
              <div class="card-head"><h3>近 14 天趋势</h3><span class="hint">上传量 / 上传流量</span></div>
              <div class="chart-box"><canvas id="trend-chart"></canvas></div>
              <div class="chart-legend">
                <span class="li"><span class="sw" style="background:var(--acc)"></span>上传文件数</span>
                <span class="li"><span class="sw" style="background:var(--info)"></span>上传流量</span>
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h3>存储策略占比</h3><span class="hint">按已用空间</span></div>
              <div class="ring-wrap">
                <div class="ring" id="storage-ring"></div>
                <div class="legend-list" id="storage-ring-legend"></div>
              </div>
            </div>
          </div>
          <div class="grid g2">
            <div class="card">
              <div class="card-head"><h3>用户组分布</h3><span class="hint">成员人数</span></div>
              <div id="group-dist"></div>
            </div>
            <div class="card">
              <div class="card-head"><h3>最近操作</h3><span class="hint">最新动态</span></div>
              <div class="timeline" id="recent-list"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="modal-mask" id="m-usource">
  <div class="modal">
    <div class="modal-head"><h3 id="usource-modal-title">切换账号来源</h3></div>
    <div class="modal-body">
      <p class="mb2" id="usource-modal-desc"></p>
      <div class="note warn"><span class="ico">!</span><div>不迁移既有账号，仅切换认证来源；本地账号密码哈希存于 data/ 卷，请自行做好卷的备份与权限</div></div>
      <div class="login-err mt2" id="usource-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" data-close>取消</button>
      <button class="btn primary" type="button" id="usource-confirm">确认切换</button>
    </div>
  </div>
</div>
<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
