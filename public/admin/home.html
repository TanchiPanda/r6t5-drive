<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概览 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="home">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>R6T5 Drive<small>管理控制台</small></div></div>
    <nav class="nav">
      <div class="nav-group">运行</div>
      <a href="/admin/home.html" class="active"><span class="ic">▤</span>概览</a>
      <a href="/admin/users.html"><span class="ic">◉</span>用户</a>
      <a href="/admin/storage.html"><span class="ic">▣</span>文件系统</a>
      <a href="/admin/groups.html"><span class="ic">◫</span>用户组</a>
      <div class="nav-group">治理</div>
      <a href="/admin/shares.html"><span class="ic">⇪</span>分享</a>
      <a href="/admin/trash.html"><span class="ic">▥</span>回收站</a>
      <a href="/admin/audit.html"><span class="ic">☰</span>审计</a>
      <div class="nav-group">系统</div>
      <a href="/admin/settings.html"><span class="ic">⚙</span>站点设置</a>
    </nav>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">概览</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>概览</h1><p class="sub">站点运行状态</p></div>
          <div class="actions"><button class="btn" id="btn-refresh" type="button">刷新</button></div>
        </div>
        <div class="stack">
          <div id="setup-note"></div>
          <div id="page-alert" class="page-alert hide"></div>
          <div class="grid g4" id="stats"></div>
          <div class="grid g2">
            <div class="card">
              <div class="card-head"><h3>近 14 天趋势</h3><span class="hint">上传量 / 上传流量</span></div>
              <div class="chart-box"><canvas id="trend-chart"></canvas></div>
              <div class="chart-legend">
                <span class="li"><span class="sw" style="background:var(--acc)"></span>上传文件数</span>
                <span class="li"><span class="sw" style="background:var(--info)"></span>上传流量</span>
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h3>存储策略占比</h3><span class="hint">按已用空间</span></div>
              <div class="ring-wrap">
                <div class="ring" id="storage-ring"></div>
                <div class="legend-list" id="storage-ring-legend"></div>
              </div>
            </div>
          </div>
          <div class="grid g2">
            <div class="card">
              <div class="card-head"><h3>用户组分布</h3><span class="hint">成员人数</span></div>
              <div id="group-dist"></div>
            </div>
            <div class="card">
              <div class="card-head"><h3>最近操作</h3><span class="hint">最新动态</span></div>
              <div class="timeline" id="recent-list"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
