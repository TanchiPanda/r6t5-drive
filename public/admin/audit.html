<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审计 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="audit">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>R6T5 Drive<small>管理控制台</small></div></div>
    <nav class="nav">
      <div class="nav-group">运行</div>
      <a href="/admin/home.html"><span class="ic">▤</span>概览</a>
      <a href="/admin/users.html"><span class="ic">◉</span>用户</a>
      <a href="/admin/storage.html"><span class="ic">▣</span>文件系统</a>
      <a href="/admin/groups.html"><span class="ic">◫</span>用户组</a>
      <div class="nav-group">治理</div>
      <a href="/admin/shares.html"><span class="ic">⇪</span>分享</a>
      <a href="/admin/trash.html"><span class="ic">▥</span>回收站</a>
      <a href="/admin/audit.html" class="active"><span class="ic">☰</span>审计</a>
      <div class="nav-group">系统</div>
      <a href="/admin/settings.html"><span class="ic">⚙</span>站点设置</a>
    </nav>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">审计</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>审计</h1><p class="sub">登录、上传、下载与管理操作记录</p></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>
          <div class="card">
            <div class="toolbar">
              <select class="select" id="audit-action" style="max-width:200px"></select>
              <input class="input search" id="audit-email" type="search" placeholder="按邮箱搜索…">
              <button class="btn" id="audit-search" type="button">筛选</button>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr><th>时间</th><th>邮箱</th><th>动作</th><th>目标</th><th class="num">大小</th><th>IP</th><th>详情</th></tr>
                </thead>
                <tbody id="audit-rows"></tbody>
              </table>
            </div>
            <div class="pager">
              <button class="btn sm" id="audit-prev" type="button">上一页</button>
              <span class="count" id="audit-count"></span>
              <span class="spacer"></span>
              <button class="btn sm" id="audit-next" type="button">下一页</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
