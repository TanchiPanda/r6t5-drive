    <main class="main">

        <div class="page-head">
          <div><h1>用户</h1><p class="sub">数据卷账号、用户分组与禁用管理</p></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>

              <h3>用户列表</h3>
              <span class="hint" id="user-total">—</span>

                <button class="btn" id="btn-add-user" type="button">新建账号</button>

                <thead>
                  <tr><th>邮箱</th><th>用户组</th><th class="num">已用空间</th><th class="num">文件数</th><th>注册时间</th><th>最近登录</th><th>状态</th><th>来源</th></tr>

<!-- 用户详情抽屉 -->
<div class="drawer-mask" id="user-drawer-mask"></div>
<aside class="drawer" id="user-drawer" aria-label="用户详情">
  <div class="drawer-head">
    <h3>用户详情</h3>
    <button class="btn icon ghost" type="button" id="drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- 新建账号 -->
<div class="modal-mask" id="m-user-create">
  <div class="modal">
    <div class="modal-head"><h3>新建账号</h3></div>
    <form id="user-create-form" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="cu-email">邮箱</label>
          <input class="input" id="cu-email" type="email" placeholder="you@example.com" autocomplete="off">
        </div>
        <div class="field">
          <label for="cu-password">初始密码</label>
          <input class="input" id="cu-password" type="password" placeholder="至少 6 位" autocomplete="off">
        </div>
        <div class="field">
          <label for="cu-display">显示名</label>
          <input class="input" id="cu-display" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="cu-group">用户组</label>
          <select class="select" id="cu-group"></select>
        </div>
        <div class="login-err" id="cu-err"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" type="submit">创建账号</button>
      </div>
    </form>
  </div>
</div>

<!-- 重置密码 -->
<div class="modal-mask" id="m-user-password">
  <div class="modal">
    <div class="modal-head"><h3>重置密码</h3></div>
    <form id="user-password-form" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="pw-new">新密码</label>
          <input class="input" id="pw-new" type="password" placeholder="至少 6 位" autocomplete="off">
        </div>
        <div class="login-err" id="pw-err"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 一键删号 -->
<div class="modal-mask" id="m-user-delete">
  <div class="modal">
    <div class="modal-head"><h3>一键删号</h3></div>
    <div class="modal-body">
      <p class="mb2" id="del-user-label"></p>
      <div class="del-options">
        <label class="del-option"><input type="radio" name="del-files" value="0" checked><span>仅删账号（保留文件）</span></label>
        <label class="del-option"><input type="radio" name="del-files" value="1"><span>删账号并删除其文件目录</span></label>
      </div>
      <div class="del-warn hide" id="del-files-warn">将同时删除该邮箱下全部文件与回收站内容，不可恢复</div>
      <div class="login-err mt2" id="del-err"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" data-close>取消</button>
      <button class="btn danger" type="button" id="del-confirm">确认删除</button>
    </div>
  </div>
</div>

<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
