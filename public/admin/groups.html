<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户组 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/branding/favicon">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="groups">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" data-brand-logo src="/assets/icons/favicon.svg" width="18" height="18" alt=""><div><span data-brand-name>R6T5 Drive</span><small>管理控制台</small></div></div>
    <nav class="nav" id="nav-admin"></nav>
    <div data-brand-sidehtml></div>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">用户组</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>用户组</h1><p class="sub">空间上限、单文件上限与 7 天上传流量</p></div>
          <div class="actions"><button class="btn primary" id="btn-add-group" type="button">新建用户组</button></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>
          <div id="group-cards"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-mask" id="m-group">
  <div class="modal">
    <div class="modal-head"><h3 id="m-group-title">新建用户组</h3></div>
    <form id="group-form" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="g-name">组名</label>
          <input class="input" id="g-name" type="text" maxlength="32" placeholder="例如：标准用户">
        </div>
        <div class="form-grid">
          <div class="field">
            <label>空间上限</label>
            <div class="limit-input">
              <input class="input" id="g-space-v" type="number" min="0" step="0.1" placeholder="例如：10">
              <select class="select" id="g-space-u"><option value="B">B</option><option value="KB">KB</option><option value="MB">MB</option><option value="GB" selected>GB</option><option value="TB">TB</option><option value="PB">PB</option><option value="EB">EB</option></select>
            </div>
            <span class="limit-preview" id="g-space-pv"></span>
          </div>
          <div class="field">
            <label>单文件上限</label>
            <div class="limit-input">
              <input class="input" id="g-file-v" type="number" min="0" step="0.1" placeholder="例如：2">
              <select class="select" id="g-file-u"><option value="B">B</option><option value="KB">KB</option><option value="MB">MB</option><option value="GB" selected>GB</option><option value="TB">TB</option><option value="PB">PB</option><option value="EB">EB</option></select>
            </div>
            <span class="limit-preview" id="g-file-pv"></span>
          </div>
          <div class="field span2">
            <label>7 天上传流量</label>
            <div class="limit-input">
              <input class="input" id="g-traffic-v" type="number" min="0" step="0.1" placeholder="例如：5">
              <select class="select" id="g-traffic-u"><option value="B">B</option><option value="KB">KB</option><option value="MB">MB</option><option value="GB" selected>GB</option><option value="TB">TB</option><option value="PB">PB</option><option value="EB">EB</option></select>
            </div>
            <span class="limit-preview" id="g-traffic-pv"></span>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="g-default"><span>设为默认用户组（新用户自动加入）</span></label>
        <label class="check"><input type="checkbox" id="g-self-signup"><span>允许自助注册（新用户自动加入本组）</span></label>
        <span class="help" id="g-self-signup-note">多个组同时开启时，注册会落到创建时间最早的那个组</span>
        <label class="check"><input type="checkbox" id="g-sudo"><span>sudo 用户组（成员可直接进入管理控制台）</span></label>
        <div class="login-err mt2" id="group-err"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-mask" id="m-sudo-confirm">
  <div class="modal modal-sm">
    <div class="modal-head"><h3>确认开启 sudo 用户组？</h3></div>
    <div class="modal-body">
      <p class="help" id="sudo-confirm-text">sudo 用户组等于把管理面板交给该组成员：他们无需管理员密码即可访问全部管理页与接口。确定开启？</p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" type="button" id="sudo-cancel">取消</button>
      <button class="btn danger" type="button" id="sudo-confirm">确定开启</button>
    </div>
  </div>
</div>

<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/sidebar.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
