<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户组 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="groups">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span><div>R6T5 Drive<small>管理控制台</small></div></div>
    <nav class="nav">
      <div class="nav-group">运行</div>
      <a href="/admin/home.html"><span class="ic">▤</span>概览</a>
      <a href="/admin/users.html"><span class="ic">◉</span>用户</a>
      <a href="/admin/storage.html"><span class="ic">▣</span>文件系统</a>
      <a href="/admin/groups.html" class="active"><span class="ic">◫</span>用户组</a>
      <div class="nav-group">治理</div>
      <a href="/admin/shares.html"><span class="ic">⇪</span>分享</a>
      <a href="/admin/trash.html"><span class="ic">▥</span>回收站</a>
      <a href="/admin/audit.html"><span class="ic">☰</span>审计</a>
      <div class="nav-group">系统</div>
      <a href="/admin/settings.html"><span class="ic">⚙</span>站点设置</a>
    </nav>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">用户组</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>用户组</h1><p class="sub">空间上限、单文件上限与 7 天上传流量</p></div>
          <div class="actions"><button class="btn primary" id="btn-add-group" type="button">新建用户组</button></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>
          <div id="group-cards"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-mask" id="m-group">
  <div class="modal">
    <div class="modal-head"><h3 id="m-group-title">新建用户组</h3></div>
    <form id="group-form" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="g-name">组名</label>
          <input class="input" id="g-name" type="text" maxlength="32" placeholder="例如：标准用户">
        </div>
        <div class="form-grid">
          <div class="field">
            <label>空间上限</label>
            <div class="limit-input">
              <input class="input" id="g-space-v" type="number" min="1" step="0.1">
              <select class="select" id="g-space-u"><option value="GB">GB</option><option value="MB">MB</option></select>
            </div>
          </div>
          <div class="field">
            <label>单文件上限</label>
            <div class="limit-input">
              <input class="input" id="g-file-v" type="number" min="1" step="0.1">
              <select class="select" id="g-file-u"><option value="GB">GB</option><option value="MB">MB</option></select>
            </div>
          </div>
          <div class="field span2">
            <label>7 天上传流量</label>
            <div class="limit-input">
              <input class="input" id="g-traffic-v" type="number" min="1" step="0.1">
              <select class="select" id="g-traffic-u"><option value="GB">GB</option><option value="MB">MB</option></select>
            </div>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="g-default"><span>设为默认用户组（新用户自动加入）</span></label>
        <div class="login-err mt2" id="group-err"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
