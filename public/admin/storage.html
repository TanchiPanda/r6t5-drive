<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件系统 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/branding/favicon">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body data-page="storage">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="brand-mark" data-brand-logo src="/assets/icons/favicon.svg" width="18" height="18" alt=""><div><span data-brand-name>R6T5 Drive</span><small>管理控制台</small></div></div>
    <nav class="nav" id="nav-admin"></nav>
    <div data-brand-sidehtml></div>
    <div class="side-foot">
      <div id="admin-identity" class="faint">未登录</div>
    </div>
  </aside>
  <div>
    <div class="topbar">
      <div class="page-title small muted">文件系统</div>
      <div class="spacer"></div>
      <div id="admin-chip" class="admin-chip"></div>
      <button class="btn icon ghost" id="theme-btn" type="button" title="切换明暗主题">☾</button>
      <a class="btn sm" href="/files" target="_blank" rel="noopener">打开前台</a>
      <button class="btn sm ghost" id="logout-btn" type="button">退出</button>
    </div>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div><h1>文件系统</h1><p class="sub">多类型存储策略、目录绑定与解析自检</p></div>
          <div class="actions"><button class="btn primary" id="btn-add-strategy" type="button">添加策略</button></div>
        </div>
        <div class="stack">
          <div id="page-alert" class="page-alert hide"></div>

          <div class="card">
            <div class="card-head"><h3>存储策略</h3><span class="hint">本地卷 / S3 兼容对象存储 / 只读仓库</span></div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr><th>策略名</th><th>类型</th><th>位置/区域</th><th class="num">容量</th><th>已用</th><th>能力</th><th>健康</th><th>操作</th></tr>
                </thead>
                <tbody id="strategy-rows"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>目录绑定</h3>
              <span class="hint">把指定目录映射到对应策略</span>
              <div class="actions"><button class="btn sm primary" id="btn-add-binding" type="button">新增绑定</button></div>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr><th>目录</th><th>策略</th><th>创建时间</th><th>操作</th></tr>
                </thead>
                <tbody id="binding-rows"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h3>解析预览</h3><span class="hint">排查某个目录会落在哪个策略上</span></div>
            <div class="row tight">
              <div class="flex1"><input class="input" id="rs-path" type="text" placeholder="例如：alice@example.com/media"></div>
              <button class="btn" id="rs-resolve" type="button">解析</button>
            </div>
            <p class="help mt2 mb0">优先级：最深匹配的绑定 &gt; 用户组默认策略 &gt; 本地默认。</p>
            <div id="rs-result" class="mt3"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-mask" id="m-add">
  <div class="modal">
    <div class="modal-head"><h3 id="m-add-title">添加存储策略</h3></div>
    <form id="strategy-form" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="st-type">存储类型</label>
          <select class="select" id="st-type"></select>
        </div>
        <div class="disclosure" id="st-disclosure"></div>
        <div class="form-grid">
          <div class="field">
            <label for="st-name">策略名</label>
            <input class="input" id="st-name" type="text" placeholder="例如：本机数据卷">
          </div>
          <div class="field">
            <label for="st-region">位置/区域</label>
            <input class="input" id="st-region" type="text" placeholder="例如：本机 data/volume">
          </div>
          <div class="field">
            <label for="st-capacity">容量</label>
            <div class="limit-input">
              <input class="input" id="st-capacity" type="number" min="1" step="0.1" placeholder="例如：100">
              <select class="select" id="st-capacity-unit">
                <option value="GB">GB</option>
                <option value="MB">MB</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>读写</label>
            <label class="check"><input type="checkbox" id="st-readonly"><span>设为只读（普通用户不可写入）</span></label>
          </div>
        </div>
        <div id="st-dyn-fields"></div>
        <div id="st-test-note"></div>
        <div class="ack-row">
          <label class="check"><input type="checkbox" id="st-ack"><span>我已了解以上信息将展示给普通用户</span></label>
          <div class="login-err" id="st-err"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" type="button" id="st-test">测试连接</button>
        <div class="spacer"></div>
        <span class="help" id="st-test-warn"></span>
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" id="st-submit" type="submit" disabled>创建策略</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-mask" id="m-bind">
  <div class="modal">
    <div class="modal-head"><h3 id="m-bind-title">新增目录绑定</h3></div>
    <form id="binding-form" novalidate>
      <div class="modal-body">
        <div class="field">
          <label for="bd-strategy">策略</label>
          <select class="select" id="bd-strategy"></select>
        </div>
        <div class="field">
          <label>生效范围</label>
          <div class="row tight">
            <label class="check"><input type="radio" name="bd-scope" id="bd-scope-site" value="site" checked><span>所有用户</span></label>
            <label class="check"><input type="radio" name="bd-scope" id="bd-scope-user" value="user"><span>指定用户</span></label>
          </div>
        </div>
        <div class="field hide" id="bd-email-field">
          <label for="bd-email">用户邮箱</label>
          <input class="input" id="bd-email" type="text" placeholder="例如：alice@example.com" autocomplete="off">
        </div>
        <div class="field">
          <label for="bd-subpath">子目录（subPath）</label>
          <input class="input" id="bd-subpath" type="text" placeholder="media" autocomplete="off">
          <span class="help">相对用户根，留空 = 用户根；例如 <span class="mono-sm">media</span> 或 <span class="mono-sm">archive/2025</span>。</span>
        </div>
        <div class="login-err" id="bd-err"></div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" type="button" data-close>取消</button>
        <button class="btn primary" id="bd-submit" type="submit">保存绑定</button>
      </div>
    </form>
  </div>
</div>

<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/sidebar.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
