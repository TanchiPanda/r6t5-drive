<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分享 · R6T5 Drive</title>
<link rel="icon" type="image/svg+xml" href="/branding/favicon">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="share">
<div class="shell no-side">
  <div class="share-wrap" id="share-wrap">
    <div class="card share-card">
      <div class="login-logo"><span class="dot"></span><div>R6T5 Drive<small>分享链接</small></div></div>
      <div id="share-body" class="stack"></div>
    </div>
  </div>
</div>

<!-- 预览弹层（结构由 app.js 的预览组件复用渲染） -->
<div class="modal-mask" id="m-share-preview">
  <div class="modal modal-wide">
    <div class="modal-head">
      <h3 id="sp-title">预览</h3>
      <div class="spacer"></div>
      <button class="btn icon ghost" id="sp-close" type="button" title="关闭"><svg aria-hidden="true"><use href="/assets/icons/sprite.svg#i-close"></use></svg></button>
    </div>
    <div class="modal-body" id="sp-body"></div>
  </div>
</div>

<div class="toasts"></div>
<script src="/assets/api.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
