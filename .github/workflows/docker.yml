name: docker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tanchipanda/r6t5-drive

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: 冒烟启动（镜像能起、健康检查可访问）
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e SESSION_SECRET=$(openssl rand -hex 32) \
            -e ADMIN_PASSWORD=ci-smoke-pass \
            ${{ env.IMAGE }}:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/setup/status >/dev/null; then
              echo "setup/status ok"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/setup/status
          docker logs smoke | tail -20
